<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Trinetra OS</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #000;
      }

      body {
        overflow: hidden;
      }

      #entry-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        opacity: 1;
        transition: opacity 280ms ease;
      }

      #entry-boot.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #entry-boot iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="entry-boot" aria-hidden="true">
      <iframe src="/loading.html" title="Trinetra Loading Screen"></iframe>
    </div>
    <div id="root"></div>
    <script type="module" src="/boot.js"></script>
  </body>
</html>
